<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rare Care Connection — Dúvidas Enviadas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text-primary: #030c3a;
      --secondary: #0472b8;
      --secondary-light: #e8f4fc;
      --white: #ffffff;
      --bg-page: #f4f7fb;
      --border: #d6e4f0;
      --text-muted: #5a6b8a;
      --shadow: 0 4px 24px rgba(3, 12, 58, 0.08);
      --radius: 12px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    .page-intro {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 0;
      text-align: center;
    }

    .page-intro h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .page-intro p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .refresh-panel {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.25rem 0;
    }

    .refresh-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
    }

    .stats {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .stats-count {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--secondary);
    }

    .stats-label {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      background: var(--secondary);
      color: var(--white);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-refresh:hover {
      background: #0360a0;
    }

    .btn-refresh:active {
      transform: scale(0.98);
    }

    .btn-refresh:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-refresh svg {
      width: 16px;
      height: 16px;
    }

    .btn-refresh.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    .state-box {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-muted);
    }

    .state-box.error {
      color: #b42318;
    }

    .state-box .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--secondary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    .questions-grid {
      display: grid;
      gap: 1rem;
    }

    .question-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-left: 4px solid var(--secondary);
      padding: 1.25rem 1.5rem;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.55;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .meta-item strong {
      color: var(--secondary);
      font-weight: 600;
    }

    .badge-apresentacao {
      display: inline-block;
      background: var(--secondary-light);
      color: var(--secondary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    .last-updated {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
    }

    footer.site-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem 1.25rem;
      margin-top: auto;
      border-top: 1px solid var(--border);
      background: var(--white);
    }

    footer.site-footer img {
      height: 40px;
      width: auto;
    }

    footer.site-footer p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      footer.site-footer img {
        height: 32px;
      }

      .refresh-card {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div class="page-intro">
    <h1>Dúvidas e comentários</h1>
    <p>Perguntas enviadas pelos participantes do Rare Care Connection</p>
  </div>

  <div class="refresh-panel">
    <div class="refresh-card">
      <div class="stats">
        <span class="stats-count" id="stats-count">—</span>
        <span class="stats-label" id="stats-label">carregando…</span>
      </div>
      <button type="button" class="btn-refresh" id="btn-refresh" aria-label="Atualizar lista">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
        Atualizar
      </button>
    </div>
  </div>

  <main>
    <div id="content">
      <div class="state-box">
        <div class="spinner" aria-hidden="true"></div>
        <p>Carregando dúvidas…</p>
      </div>
    </div>
    <p class="last-updated" id="last-updated" hidden></p>
  </main>

  <footer class="site-footer">
    <img src="assets/alnylam-logo.png" alt="Alnylam" />
    <p>Rare Care Connection · Dados em tempo real</p>
  </footer>

  <script>
    const API_URL = "https://connection.eventos-info.com.br/api/duvidas-aprovadas";

    let allQuestions = [];

    const $ = (id) => document.getElementById(id);

    const icons = {
      user: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
      calendar: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
      clock: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`,
    };

    function formatDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleString("pt-BR", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function normalize(item) {
      const a = item.attributes || item;
      return {
        id: item.id,
        nome: a.nome_completo || "Anônimo",
        dataAgenda: a.data_agenda || "—",
        apresentacao: a.apresentacao || "—",
        pergunta: a.pergunta_ou_comentario || "",
        dataEnvio: a.data_envio,
        dataEnvioMs: a.data_envio ? new Date(a.data_envio).getTime() : 0,
      };
    }

    function render(questions) {
      const content = $("content");

      $("stats-count").textContent = questions.length;
      $("stats-label").textContent =
        questions.length === 1 ? "dúvida exibida" : "dúvidas exibidas";

      if (questions.length === 0) {
        content.innerHTML = `
          <div class="state-box">
            <p>Nenhuma dúvida enviada ainda.</p>
          </div>`;
        return;
      }

      const cards = questions
        .map(
          (q) => `
        <article class="question-card" data-id="${q.id}">
          <span class="badge-apresentacao">${escapeHtml(q.apresentacao)}</span>
          <p class="question-text">${escapeHtml(q.pergunta)}</p>
          <div class="question-meta">
            <span class="meta-item">${icons.user} <strong>${escapeHtml(q.nome)}</strong></span>
            <span class="meta-item">${icons.calendar} Agenda: ${escapeHtml(q.dataAgenda)}</span>
            <span class="meta-item">${icons.clock} Enviado em ${escapeHtml(formatDate(q.dataEnvio))}</span>
          </div>
        </article>`
        )
        .join("");

      content.innerHTML = `<div class="questions-grid">${cards}</div>`;
    }

    function setLoading(isLoading) {
      const btn = $("btn-refresh");
      btn.disabled = isLoading;
      btn.classList.toggle("spinning", isLoading);
    }

    function showError(message) {
      $("content").innerHTML = `
        <div class="state-box error">
          <p><strong>Não foi possível carregar as dúvidas.</strong></p>
          <p style="margin-top:0.5rem;font-size:0.875rem;">${escapeHtml(message)}</p>
        </div>`;
      $("stats-count").textContent = "—";
      $("stats-label").textContent = "erro ao carregar";
    }

    async function fetchQuestions() {
      setLoading(true);
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const data = json.data || [];

        allQuestions = data
          .map(normalize)
          .sort((a, b) => b.dataEnvioMs - a.dataEnvioMs);

        render(allQuestions);

        const updated = $("last-updated");
        updated.hidden = false;
        updated.textContent = `Última atualização: ${formatDate(new Date().toISOString())}`;
      } catch (err) {
        console.error(err);
        showError(
          err.message === "Failed to fetch"
            ? "Verifique sua conexão ou se a página está hospedada com acesso à API (CORS)."
            : err.message
        );
      } finally {
        setLoading(false);
      }
    }

    $("btn-refresh").addEventListener("click", fetchQuestions);
    fetchQuestions();
  </script>
</body>
</html>
